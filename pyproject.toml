[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calorai-logging-agent"
version = "0.1.0"
description = "Conversational meal-logging agent for CalorAI — text + photo, memory, running totals."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["calorai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
